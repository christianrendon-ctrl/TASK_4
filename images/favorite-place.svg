<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="placeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f2e" />
      <stop offset="50%" stop-color="#09141f" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <linearGradient id="placeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <radialGradient id="skyAura" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#placeGrad)" rx="16"/>
  <circle cx="300" cy="180" r="160" fill="url(#skyAura)" />
  
  <!-- Mountain Peaks & Nature Scenery -->
  <g fill="none" stroke="url(#placeAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back mountain -->
    <polygon points="120,300 240,150 360,300" fill="#0d2338" stroke="url(#placeAccent)" stroke-width="3"/>
    <polyline points="240,150 255,185 240,200 260,225" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Middle mountain peak -->
    <polygon points="260,300 390,110 510,300" fill="#132f4a" stroke="url(#placeAccent)" stroke-width="4"/>
    <polyline points="390,110 405,160 385,180 415,220" stroke="#bae6fd" stroke-width="3"/>
    <!-- Front foothills -->
    <polygon points="60,300 170,220 290,300" fill="#09192b" stroke="url(#placeAccent)" stroke-width="3"/>
    <!-- Sun / Moon in sky -->
    <circle cx="450" cy="120" r="30" fill="#0284c7" stroke="#7dd3fc" stroke-width="3"/>
    <!-- Water line / Reflection base -->
    <line x1="80" y1="315" x2="520" y2="315" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 10"/>
    <line x1="140" y1="330" x2="460" y2="330" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="12 8"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(300, 390)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#081420" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Scenic Mountains &amp; Coastal Horizons</text>
  </g>
</svg>
