<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241416" />
      <stop offset="50%" stop-color="#180e10" />
      <stop offset="100%" stop-color="#0d0708" />
    </linearGradient>
    <linearGradient id="foodAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <radialGradient id="foodAura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#foodGrad)" rx="16"/>
  <circle cx="300" cy="210" r="180" fill="url(#foodAura)" />
  
  <!-- Modern Culinary / Gourmet Plate & Cloche graphic -->
  <g fill="none" stroke="url(#foodAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Plate base -->
    <ellipse cx="300" cy="270" rx="140" ry="24" fill="#201114" stroke="url(#foodAccent)" stroke-width="4"/>
    <!-- Dome / Cloche -->
    <path d="M 190 260 C 190 160, 410 160, 410 260 Z" fill="#291419" stroke="url(#foodAccent)" stroke-width="4"/>
    <!-- Cloche Handle -->
    <circle cx="300" cy="148" r="14" fill="#291419" stroke="url(#foodAccent)" stroke-width="4"/>
    <!-- Steam swirls -->
    <path d="M 270 120 C 265 105, 275 95, 270 80" stroke="#fda4af" stroke-width="3"/>
    <path d="M 300 120 C 295 100, 305 90, 300 70" stroke="#fda4af" stroke-width="3"/>
    <path d="M 330 120 C 325 105, 335 95, 330 80" stroke="#fda4af" stroke-width="3"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(300, 380)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1b0c0f" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Comfort Food &amp; Artisanal Cuisine</text>
  </g>
</svg>
