<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="50%" stop-color="#0e101a" />
      <stop offset="100%" stop-color="#181c2e" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="260" r="240" fill="url(#softGlow)" />

  <!-- Subtle grid pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
  </g>

  <!-- Stylized Avatar Silhouette -->
  <g fill="none" stroke="url(#glowRing)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="300" cy="220" r="85" fill="#1b1f32" stroke="url(#glowRing)" stroke-width="4"/>
    <!-- Shoulders / Torso -->
    <path d="M 160 450 C 160 360, 220 330, 300 330 C 380 330, 440 360, 440 450" fill="#1b1f32" stroke="url(#glowRing)" stroke-width="4"/>
  </g>

  <!-- Monogram Badge in center -->
  <circle cx="300" cy="220" r="45" fill="#11131e" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <text x="300" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" text-anchor="middle">CR</text>

  <!-- Overlay Placeholder Tag -->
  <g transform="translate(300, 515)">
    <rect x="-185" y="-22" width="370" height="44" rx="22" fill="#0d0f17" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="-150" cy="0" r="6" fill="#38bdf8" />
    <text x="-130" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Photo Placeholder • Ready for upload</text>
  </g>
</svg>
